name: Test and deploy

# Tests every push and pull request. A push to main then deploys to the cPanel server over SSH, checks the app
# loaded its services and can still read a plate, and rolls production back if anything fails.
# One-time setup (SSH key, secrets, server checkout): vision_service_production_fix.md in the kemotives monorepo, §7.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13' # what the server's virtualenv runs
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Check syntax
        run: python -m compileall -q passenger_wsgi.py main.py models.py services

      - name: Run tests
        # Only tests/: the test_*.py scripts at the root call Google for real
        run: pytest -q tests
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'

  deploy:
    name: Deploy to production
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: vision-production
      cancel-in-progress: false
    env:
      APP_DIR: /home3/diksxcar/vision
      VISION_URL: https://vision.kemotives.co.ke

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host server\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 20\n' \
            "$SSH_HOST" "${SSH_PORT:-22}" "$SSH_USER" > ~/.ssh/config

      - name: Record the running version
        id: before
        run: echo "sha=$(ssh server "git -C '$APP_DIR' rev-parse HEAD")" >> "$GITHUB_OUTPUT"

      - name: Deploy
        run: ssh server "APP_DIR='$APP_DIR' bash -s -- deploy" < .github/scripts/server_deploy.sh

      - name: Start the app
        # The first request after a restart loads the services (~15 s)
        run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors --max-time 90 "$VISION_URL/health"

      - name: Check the app loaded its services
        run: ssh server "APP_DIR='$APP_DIR' bash -s -- startup-ok" < .github/scripts/server_deploy.sh

      - name: Smoke test
        run: |
          pip install --quiet pillow
          python .github/scripts/smoke_test.py "$VISION_URL"

      - name: Roll back
        if: failure() && steps.before.outputs.sha != ''
        env:
          ROLLBACK_SHA: ${{ steps.before.outputs.sha }}
        run: |
          ssh server "APP_DIR='$APP_DIR' bash -s -- rollback '$ROLLBACK_SHA'" < .github/scripts/server_deploy.sh
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors --max-time 90 "$VISION_URL/health"
          echo "::error::Deploy failed; production was rolled back to ${ROLLBACK_SHA:0:7}"
